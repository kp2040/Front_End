<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Validation Form</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      background:#f4f4f4;
      padding:40px;
    }

    .container{
      width:400px;
      margin:auto;
      background:white;
      padding:20px;
      border-radius:10px;
      box-shadow:0 0 10px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      margin-bottom:20px;
    }

    input{
      width:100%;
      padding:10px;
      margin-bottom:15px;
      border:1px solid #ccc;
      border-radius:5px;
    }

    button{
      width:100%;
      padding:10px;
      background:#007bff;
      color:white;
      border:none;
      border-radius:5px;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#0056b3;
    }

    .error{
      color:red;
      font-size:14px;
      margin-bottom:10px;
    }

    .output{
      margin-top:20px;
      background:#eee;
      padding:10px;
      border-radius:5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Link Form</h2>

    <form id="linkForm">

      <input type="text" id="title" placeholder="Enter Title" required>

      <input type="text" id="url" placeholder="Enter URL (https://example.com)" required>

      <div class="error" id="errorMsg"></div>

      <button type="submit">Add Link</button>

    </form>

    <div class="output">
      <h3>Stored Objects:</h3>
      <pre id="result"></pre>
    </div>
  </div>

  <script>

    // Array to store objects
    let links = [];

    // Form submit event
    document.getElementById("linkForm").addEventListener("submit", function(e){

      e.preventDefault();

      let title = document.getElementById("title").value.trim();
      let url = document.getElementById("url").value.trim();

      let errorMsg = document.getElementById("errorMsg");

      // Regex for https:// validation
      let urlPattern = /^https:\/\/.+/;

      // Check URL format
      if(!urlPattern.test(url)){
        errorMsg.textContent = "Invalid URL! URL must start with https://";
        return;
      }

      // Clear error message
      errorMsg.textContent = "";

      // Create object
      let linkObject = {
        title: title,
        url: url
      };

      // Push object into array
      links.push(linkObject);

      // Display array
      document.getElementById("result").textContent =
        JSON.stringify(links, null, 2);

      // Reset form
      document.getElementById("linkForm").reset();

    });

  </script>

</body>
</html>
