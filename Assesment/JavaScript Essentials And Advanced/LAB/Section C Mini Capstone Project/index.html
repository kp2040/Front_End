<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bio-Stack Builder</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Arial, sans-serif;
      transition:0.3s;
      background:#f4f4f4;
      color:#222;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    /* DARK MODE */
    body.dark{
      background:#121212;
      color:white;
    }

    .container{
      width:100%;
      max-width:420px;
      background:white;
      padding:25px;
      border-radius:18px;
      box-shadow:0 0 15px rgba(0,0,0,0.1);
      transition:0.3s;
    }

    body.dark .container{
      background:#1e1e1e;
    }

    .profile{
      text-align:center;
      margin-bottom:25px;
    }

    .profile img{
      width:90px;
      height:90px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:10px;
    }

    .profile h2{
      margin-bottom:5px;
    }

    .profile p{
      font-size:14px;
      opacity:0.8;
    }

    .theme-toggle{
      margin-top:15px;
    }

    .theme-toggle button{
      padding:10px 15px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      background:#007bff;
      color:white;
      font-size:14px;
    }

    form{
      margin-top:20px;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      font-size:15px;
    }

    body.dark input{
      background:#2a2a2a;
      border:1px solid #444;
      color:white;
    }

    .add-btn{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#28a745;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    .add-btn:hover{
      background:#1e7e34;
    }

    .error{
      color:red;
      font-size:14px;
      margin-bottom:10px;
    }

    .links{
      margin-top:25px;
    }

    .link-item{
      display:flex;
      align-items:center;
      gap:10px;
      margin-bottom:12px;
    }

    .link-btn{
      flex:1;
      text-decoration:none;
      padding:12px;
      border-radius:8px;
      background:#007bff;
      color:white;
      text-align:center;
      transition:0.3s;
      word-break:break-word;
    }

    .link-btn:hover{
      background:#0056b3;
    }

    .remove-btn{
      border:none;
      background:red;
      color:white;
      padding:12px;
      border-radius:8px;
      cursor:pointer;
    }

    .remove-btn:hover{
      background:darkred;
    }

    /* MOBILE FIRST */
    @media (max-width:500px){

      .container{
        padding:20px;
      }

      .link-item{
        flex-direction:column;
      }

      .remove-btn{
        width:100%;
      }

    }

  </style>
</head>
<body>

  <div class="container">

    <!-- PROFILE -->
    <div class="profile">

      <img src="https://i.pravatar.cc/150?img=3" alt="profile">

      <h2>Creator Profile</h2>

      <p>Welcome to my Bio-Stack 🚀</p>

      <!-- THEME TOGGLE -->
      <div class="theme-toggle">
        <button id="themeBtn">Toggle Dark Mode</button>
      </div>

    </div>

    <!-- FORM -->
    <form id="linkForm">

      <input
        type="text"
        id="title"
        placeholder="Enter Link Title"
        required
      >

      <input
        type="text"
        id="url"
        placeholder="https://example.com"
        required
      >

      <div class="error" id="errorMsg"></div>

      <button type="submit" class="add-btn">
        Add Link
      </button>

    </form>

    <!-- LINKS -->
    <div class="links" id="linksContainer"></div>

  </div>

  <script>

    // LOAD DATA
    let links = JSON.parse(localStorage.getItem("bioLinks")) || [];

    let currentTheme = localStorage.getItem("theme") || "light";

    // APPLY SAVED THEME
    if(currentTheme === "dark"){
      document.body.classList.add("dark");
    }

    // THEME TOGGLE
    document.getElementById("themeBtn").addEventListener("click", function(){

      document.body.classList.toggle("dark");

      // SAVE THEME
      if(document.body.classList.contains("dark")){
        localStorage.setItem("theme", "dark");
      }
      else{
        localStorage.setItem("theme", "light");
      }

    });

    // FORM SUBMIT
    document.getElementById("linkForm").addEventListener("submit", function(e){

      e.preventDefault();

      let title = document.getElementById("title").value.trim();

      let url = document.getElementById("url").value.trim();

      let errorMsg = document.getElementById("errorMsg");

      // VALIDATION
      if(title === "" || url === ""){
        errorMsg.textContent = "All fields are required!";
        return;
      }

      // URL VALIDATION
      let regex = /^https:\/\/.+/;

      if(!regex.test(url)){
        errorMsg.textContent =
          "URL must start with https://";
        return;
      }

      errorMsg.textContent = "";

      // CREATE OBJECT
      let linkObject = {
        title:title,
        url:url
      };

      // ADD TO ARRAY
      links.push(linkObject);

      // SAVE
      saveLinks();

      // RENDER
      renderLinks();

      // RESET FORM
      document.getElementById("linkForm").reset();

    });

    // SAVE TO LOCALSTORAGE
    function saveLinks(){

      localStorage.setItem(
        "bioLinks",
        JSON.stringify(links)
      );

    }

    // RENDER LINKS
    function renderLinks(){

      let container =
        document.getElementById("linksContainer");

      container.innerHTML = "";

      links.forEach(function(link, index){

        // MAIN WRAPPER
        let div = document.createElement("div");

        div.className = "link-item";

        // LINK BUTTON
        let a = document.createElement("a");

        a.href = link.url;

        a.textContent = link.title;

        a.target = "_blank";

        a.className = "link-btn";

        // REMOVE BUTTON
        let removeBtn =
          document.createElement("button");

        removeBtn.textContent = "Remove";

        removeBtn.className = "remove-btn";

        // REMOVE EVENT
        removeBtn.addEventListener("click", function(){

          // DELETE
          links.splice(index, 1);

          // UPDATE STORAGE
          saveLinks();

          // UPDATE UI
          renderLinks();

        });

        // APPEND
        div.appendChild(a);

        div.appendChild(removeBtn);

        container.appendChild(div);

      });

    }

    // AUTO LOAD
    renderLinks();

  </script>

</body>
</html>
