<body>
    <script>

        // only Array 
        let array = [1, 2, 3, 4,]
        console.log(array)

        // // only Object

        let person = {
            name: "kp",
            age: "23",
        }
        console.log(person.name)

        // // Array inside Object

        let arr = [1, 2, 3, 4, {
            name: "sachin",
            course: "mernstack",
        }, 6, 7, 8]
        console.log(arr[4].course)
 
        // // object inside array

        let data = {
            name: "krish",
            course: ["front", "back", "full"]

        }
        console.log(data.course[2])




    </script>



</body>
