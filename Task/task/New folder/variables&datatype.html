<!DOCTYPE html>
<html>
<head>
    <title>Variables and Datatypes</title>
</head>
<body>

    <h1>JavaScript Variables and Datatypes</h1>

    <script>
        // String
        let name = "Krish";

        // Number
        let age = 20;

        // Boolean
        let isStudent = true;

        // Array
        let subjects = ["HTML", "CSS", "JavaScript"];

        // Object
        let person = {
            name: "Krish",
            age: 20
        };

        console.log(name);
        console.log(age);
        console.log(isStudent);
        console.log(subjects);
        console.log(person);

        document.write

    </script>

</body>
</html>
