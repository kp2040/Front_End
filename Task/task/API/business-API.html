<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business API</title>
</head>
<body>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Company</th>
                <th>Industry</th>
            </tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>

        fetch('https://api.mydummyapi.com/categories/business')
        .then((data) => data.json())
        .then((res) => {

            let businessdata = res.map((data) => {
                return `
                <tr>
                    <td>${data.id}</td>
                    <td>${data.company}</td>
                    <td>${data.industry}</td>
                </tr>
                `;
            });

            // Join array into string and display
            document.querySelector('#tbody').innerHTML = businessdata.join('');

        })

    </script>

</body>
</html>
