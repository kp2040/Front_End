<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" />
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" href="./image/download.png">
    <title>Bookmyshow</title>
</head>

<body>
    <!-- HEADER START -->
    <header>
        <div class="container"> 
            <div class="header-wrapper py-3">
                <div class="row"> 
                    <div class="col-md-7">
                        <div class="row">
                            <div class="col-2">
                                <div class="logo-area">
                                    <a class="text-decoration-none text-dark" href="index.html" aria-label="Logo">
                                    <img src="./image/logo.png" alt="logo">
                                    </a>
                                </div>
                            </div>
                            <div class="col-10">
                                <div class="search-area">
                                    <div class="search-wrapper border border-secondary" data-bs-toggle="modal"
                                        data-bs-target="#searchmodal">
                                        <i class="fa-solid fa-magnifying-glass"></i>
                                        <input type="search" class="border-0"
                                            placeholder="Search for movies, Events, Plays, Sports and activities">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-5">
                        <div class="header-right text-decoration-none text-dark text-end">
                            <!-- Button trigger modal -->
                            <button type="button" class="btn " data-bs-toggle="modal" data-bs-target="#exampleModal">
                                Mumbai <i class="fa-solid fa-angle-down"></i>
                            </button>
                            <button class="signin btn btn-danger" data-bs-toggle="modal" data-bs-target="#signin">sign
                                in</button>
                            <button class="btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#locaiton"
                                aria-controls="locaiton"><i class="fa-solid fa-bars"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="menu-area bg-light py-3">
            <div class="container">
                <div class="row">
                    <div class="col-7">
                        <nav>
                            <ul class="d-flex align-items-center list-unstyled gap-3 mb-0">
                                <li><a class="text-decoration-none text-dark" href="">Movies</a></li>
                                <li><a class="text-decoration-none text-dark" href="">Stream</a></li>
                                <li><a class="text-decoration-none text-dark" href="">Events</a></li>
                                <li><a class="text-decoration-none text-dark" href="">Plays</a></li>
                                <li><a class="text-decoration-none text-dark" href="">Sports</a></li>
                                <li><a class="text-decoration-none text-dark" href="">Activities</a></li>
                                <li><a class="text-decoration-none text-dark" href="">TATA IPL 2026</a></li>
                            </ul>
                        </nav>
                    </div>
                    <div class="col-5">
                        <nav>
                            <ul class="d-flex align-items-center justify-content-end list-unstyled gap-3 mb-0">
                                <li><a class="text-decoration-none text-dark" href="">ListYourShow</a></li>
                                <li><a class="text-decoration-none text-dark" href="">Corporates</a></li>
                                <li><a class="text-decoration-none text-dark" href="">Offers</a></li>
                                <li><a class="text-decoration-none text-dark" href="">Gift Cards</a></li>
                            </ul>
                        </nav>
                    </div>
                </div>
            </div>
        </div>

    </header>
    <!-- HEADER END -->


    <!-- jS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- search Modal -->
    <!-- Button trigger modal -->


    <!-- Search Modal -->
    <div class="modal fade" id="searchmodal" tabindex="-1" aria-labelledby="searchmodalLabel" aria-hidden="true">
        <div class="modal-dialog modal-fullscreen">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="searchbox position-relative">
                        <input type="search" class="form-control">
                    </div>
                    <h1 class="modal-title fs-5" id="searchmodalLabel">Modal title </h1>
                  
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    ...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Signin Modal -->
    <div class="modal fade" id="signin" tabindex="-1" aria-labelledby="signinLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="signinLabel">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    ...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>
    <!--Location Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    ...
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" class="btn btn-primary">Save changes</button>
                </div>
            </div>
        </div>
    </div>
    <!-- Location Modal  -->
    <div class="offcanvas offcanvas-end" data-bs-scroll="true" tabindex="-1" id="locaiton" aria-labelledby="locaiton">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="locaiton">Backdrop with scrolling
            </h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <p>Try scrolling the rest of the page to see this option in action</p>
        </div>
    </div>
</body> 
</html>
