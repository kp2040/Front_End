<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 10px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        img {
            width: 100px;
            height: auto;
        }
        .in-stock {
            color: green;
            font-weight: bold;
        }
        .out-of-stock {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Product Catalog</h2>

    <table>
        <tr>
            <th>Product Name</th>
            <th>Product Image</th>
            <th>Price</th>
            <th>Description</th>
            <th>Availability</th>
        </tr>

        <tr>
            <td>Smartphone</td>
            <td><img src="image -1.jpg" alt="Smartphone"></td>
            <td>$299</td>
            <td>High-quality smartphone with advanced features.</td>
            <td class="in-stock">In Stock</td>
        </tr>

        <tr>
            <td>Laptop</td>
            <td><img src="Laptop image -1.webp"h alt="Laptop"></td>
            <td>$799</td>
            <td>Powerful laptop suitable for work and gaming.</td>
            <td class="out-of-stock">Out of Stock</td>
        </tr>

        <tr>
            <td>Headphones</td>
            <td><img src="Headphones image.webp" alt="Headphones"></td>
            <td>$99</td>
            <td>Noise-cancelling over-ear headphones.</td>
            <td class="in-stock">In Stock</td>
        </tr>

    </table>

</body>
</html>
