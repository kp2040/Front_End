<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // Declare array
let numbers = [10, 20, 30, 40, 50];

// Variable to store sum
let sum = 0;

// Loop through array
for (let i = 0; i < numbers.length; i++) {
    sum += numbers[i];
}

// Display result
console.log("Sum of array elements:", sum);
    </script>
</body>
</html>
