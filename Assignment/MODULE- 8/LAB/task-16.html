<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // Create object
let car = {
    brand: "Toyota",
    model: "Fortuner",
    year: 2020
};

// Access and print brand and model
console.log("Brand:", car.brand);
console.log("Model:", car.model);

// Update year property
car.year = 2024;

// Add new property
car.color = "Black";

// Print updated object
console.log(car);
    </script>
</body>
