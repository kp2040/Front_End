<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        // Initialize variables
let i = 1;
let sum = 0;

// While loop to add even numbers from 1 to 20
while (i <= 20) {

    if (i % 2 === 0) {
        sum += i;
    }

    i++;
}

// Display result
console.log("Sum of even numbers:", sum);
    </script>
</body>
</html>
