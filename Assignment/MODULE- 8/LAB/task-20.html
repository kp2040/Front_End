<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Change</title>
</head>
<body>

    <h1>Background color will change after 5 seconds</h1>

    <script>
        // Change background color after 5 seconds
        setTimeout(function () {
            document.body.style.backgroundColor = "blue";
        }, 5000);
    </script>

</body>
</html>
