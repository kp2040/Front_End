<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid</title>
    <style>
        body{
            padding: 20px 0;
        }
        .grid{
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-auto-rows: 410px;
            gap: 20px;
        }
        .card{
            width: 100%;
            border: 2px solid black;
            border-radius: 8px;
            text-align: center;
        }
        .card:hover{
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
