<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Three Column Layout</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="row align-items-center">

        <!-- Column 1 : Profile Image -->
        <div class="col-md-5 text-center mb-4 mb-md-0">
            <img
                src="images/profile.jpg"
                alt="Profile Picture"
                class="img-fluid rounded-circle"
                width="250">
        </div>

        <!-- Column 2 : Bio -->
        <div class="col-md-5 mb-4 mb-md-0">
            <h2>Krish Panchal</h2>
            <h5 class="text-muted">@krish_panchal</h5>

            <p class="mt-3">
                💻 Front-End Developer <br>
                🎓 Computer Engineering Graduate <br>
                ⚛️ Learning React.js & Bootstrap <br>
                🚀 Passionate about Web Development.
            </p>

            <button class="btn btn-primary">
                Follow
            </button>
        </div>

        <!-- Column 3 : Favorite Music Apps -->
        <div class="col-md-2">
            <h5 class="mb-3">Music Apps</h5>

            <ul class="list-group">
                <li class="list-group-item">Spotify</li>
                <li class="list-group-item">YouTube Music</li>
                <li class="list-group-item">Wynk</li>
            </ul>
        </div>

    </div>

</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
